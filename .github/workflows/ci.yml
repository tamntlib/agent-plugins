name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-plugins:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test tamntlib-agent-profiles
        working-directory: plugins/agent-profiles
        run: npm test
      - name: Test tamntlib-agent-hindsight
        working-directory: plugins/agent-hindsight
        run: npm test

  skill-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify flat skill layout
        run: test -z "$(find plugins -path '*/skills/*/*/*/SKILL.md')"
      - name: Run offline Backlog script tests
        run: python3 -m unittest discover -s plugins/skills/skills/backlog/scripts -p "test_*.py"
      - name: Run offline Telegram script tests
        run: python3 -m unittest discover -s plugins/skills/skills/telegram/scripts -p "test_*.py"
      - name: Run offline Microsoft Teams script tests
        run: |
          pip install --quiet -r plugins/skills/skills/microsoft-teams/scripts/requirements.txt
          TMP_SAFE="$(mktemp -d "$HOME/.teams-test.XXXXXX")"
          chmod 700 "$TMP_SAFE"
          trap 'rm -rf "$TMP_SAFE"' EXIT
          TMPDIR="$TMP_SAFE" python3 -m unittest discover -s plugins/skills/skills/microsoft-teams/scripts -p "test_*.py"
